<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reduced Motion & No-JS Carousel Test</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <style>
    /* Force reduced motion styles for visual capture */
    .carousel-forced-reduced .carousel__stage {
      perspective: none !important;
      transform-style: flat !important;
      height: auto !important;
      overflow-x: auto !important;
      scroll-snap-type: x mandatory !important;
      -webkit-overflow-scrolling: touch;
      padding-bottom: var(--space-3);
      cursor: default !important;
      display: flex !important;
      justify-content: flex-start !important;
    }

    .carousel-forced-reduced .carousel__track {
      transform-style: flat !important;
      display: flex !important;
      gap: var(--space-4) !important;
      width: max-content !important;
      height: auto !important;
      pointer-events: auto !important;
    }

    .carousel-forced-reduced .carousel__card {
      position: static !important;
      transform: none !important;
      margin: 0 !important;
      flex: 0 0 min(280px, 75vw) !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      scroll-snap-align: center !important;
      transition: none !important;
    }

    .carousel-forced-reduced .carousel__card-overlay {
      display: none !important;
    }
  </style>
</head>
<body class="section--bone" style="padding: 2rem;">
  <div class="container">
    <h1>Reduced Motion &amp; Fallback Verification</h1>

    <div style="margin-bottom: 4rem;">
      <p class="label" style="margin-bottom: 1rem;">1. Reduced Motion: Flat Horizontal Scroll-Snap Row (No 3D Tilt, No Autoplay)</p>
      <div class="carousel carousel-forced-reduced" role="region" aria-label="Lookbook Flat Scroll Row">
        <div class="carousel__stage">
          <div class="carousel__track">
            <article class="carousel__card hairline" style="opacity: 1;">
              <img src="assets/img/gallery/bridal-odia-red-01.webp" alt="Odia Bridal" class="carousel__card-img">
            </article>
            <article class="carousel__card hairline" style="opacity: 1;">
              <img src="assets/img/gallery/bridal-closeup-02.webp" alt="Bridal Close-Up" class="carousel__card-img">
            </article>
            <article class="carousel__card hairline" style="opacity: 1;">
              <img src="assets/img/gallery/reception-gown-01.webp" alt="Reception Gown" class="carousel__card-img">
            </article>
            <article class="carousel__card hairline" style="opacity: 1;">
              <img src="assets/img/gallery/party-glam-01.webp" alt="Party Glam" class="carousel__card-img">
            </article>
            <article class="carousel__card hairline" style="opacity: 1;">
              <img src="assets/img/gallery/editorial-bold-lip-01.webp" alt="Editorial Bold Lip" class="carousel__card-img">
            </article>
            <article class="carousel__card hairline" style="opacity: 1;">
              <img src="assets/img/gallery/everyday-natural-01.webp" alt="Everyday Natural" class="carousel__card-img">
            </article>
          </div>
        </div>
      </div>
    </div>

    <div>
      <p class="label" style="margin-bottom: 1rem;">2. No-JS Fallback Block</p>
      <div class="carousel__noscript-fallback">
        <p class="text-muted">Explore featured bridal and occasion looks in our lookbook:</p>
        <a href="gallery.html" class="btn btn--outline" style="margin-top: var(--space-3); display: inline-flex;">Open the full lookbook →</a>
      </div>
    </div>
  </div>
</body>
</html>
