<body class="section--paper">
  <a class="skip" href="#main">Skip to content</a>

  <header id="site-header"></header>

  <main id="main" class="container section">
    <header style="margin-bottom: var(--space-6);" data-reveal>
      <span class="eyebrow">PORTFOLIO &amp; EDITORIALS</span>
      <h1 class="h1">The Lookbook.</h1>
      <p class="lead" style="margin-top: var(--space-3); max-width: 62ch;">
        Real clients, real days. Tap any look to inspect the artistry in high resolution, or book a similar customized styling for your occasion.
      </p>
    </header>

    <!-- Dynamic Category Filter Bar -->
    <nav id="gallery-filters" aria-label="Lookbook categories filter" data-reveal data-delay="1"></nav>

    <!-- Dynamic Gallery Cards Grid (dense auto-flow layout) -->
    <section aria-label="Lookbook Gallery Grid">
      <div class="gallery-grid" id="gallery-grid" data-reveal data-delay="2"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <dialog id="booking"></dialog>

  <!-- Lightbox Element -->
  <div id="gallery-lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Lookbook Lightbox View"></div>

  <!-- Scripts -->
  <script defer src="data/site.js"></script>
